<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - LMC Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 共通CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/lmc-loader.css">
    <script defer src="/js/lmc-loader-transition.js?v=20261113-1"></script>
    <style>
        /* 万が一の真っ白防止用 */
        body.loading-failed { display: block !important; }
        .booking-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        .booking-calendar-day {
            min-height: 132px;
        }
        .booking-calendar-day.is-outside {
            background: #f8fafc;
        }
        .booking-calendar-day.is-outside .booking-calendar-date {
            color: #cbd5e1;
        }
        .booking-calendar-day.is-today {
            background: #eff6ff;
        }
        .booking-calendar-event {
            transform: translateZ(0);
        }
        @media (max-width: 767px) {
            .booking-calendar-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .booking-calendar-inner {
                min-width: 760px;
            }
        }
    </style>
</head>
<body id="main-body" class="min-h-screen flex overflow-hidden bg-[#f8fafc]">
    <!-- ローディング画面 (真っ白防止) -->
    <div id="initial-loader" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-300" role="status" aria-live="polite">
        <img class="lmc-wave-loader" src="/assets/lmc-wave-loader.svg" alt="">
        <p class="lmc-loading-label">予約情報を準備中...</p>
    </div>

    <!-- サイドバーコンテナ -->
    <div id="sidebar-container"></div>

    <!-- メインコンテンツ -->
    <main class="flex-1 ml-[260px] h-screen overflow-y-auto p-8 relative">
        <header class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-extrabold text-gray-800 uppercase tracking-widest">Booking System</h2>
                <p class="text-[10px] text-gray-400 mt-1 font-bold uppercase tracking-wider">スタジオ予約管理・システム設定</p>
            </div>
            <div id="db-status" class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-circle text-[8px] text-gray-300"></i> Connecting...
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- 左側: 予約リスト -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 月移動ツールバー -->
                <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 p-5 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="window.changeBookingMonth(-1)" aria-label="前の月" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <h3 id="booking-month-label" class="min-w-[142px] text-center text-base font-extrabold text-gray-800"></h3>
                        <button type="button" onclick="window.changeBookingMonth(1)" aria-label="次の月" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                        <button type="button" onclick="window.goToBookingToday()" class="ml-1 px-4 h-10 rounded-xl border border-gray-200 text-[11px] font-extrabold text-gray-600 hover:bg-gray-50 transition-colors">今日</button>
                    </div>
                    <div class="flex gap-3 items-center">
                        <span id="booking-month-count" class="hidden sm:inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-gray-50 text-[10px] font-extrabold text-gray-400">
                            <i class="fa-solid fa-calendar-days"></i><span>0件</span>
                        </span>
                        <button onclick="window.openAddBookingModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 transition-all shadow-lg shadow-blue-50">
                            <i class="fa-solid fa-plus"></i> 新規予約を追加
                        </button>
                    </div>
                </div>

                <!-- 月間予約カレンダー -->
                <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden booking-calendar-scroll">
                    <div class="booking-calendar-inner">
                        <div class="booking-calendar-grid border-b border-gray-100 bg-gray-50/70 text-center text-[10px] font-extrabold text-gray-400">
                            <div class="py-4 text-red-400">日</div>
                            <div class="py-4">月</div>
                            <div class="py-4">火</div>
                            <div class="py-4">水</div>
                            <div class="py-4">木</div>
                            <div class="py-4">金</div>
                            <div class="py-4 text-blue-500">土</div>
                        </div>
                        <div id="booking-calendar-grid" class="booking-calendar-grid" aria-live="polite">
                            <div class="col-span-7 py-20 text-center text-gray-400">
                                <div class="lmc-loading-state" role="status">
                                    <img class="lmc-wave-loader lmc-wave-loader--small" src="/assets/lmc-wave-loader.svg" alt="">
                                    <span>今月の予約を読み込み中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側: システム設定 -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-[32px] p-8 shadow-sm border border-gray-100 sticky top-8">
                    <h4 class="font-extrabold text-gray-800 mb-6 uppercase text-xs tracking-[0.1em] border-b border-gray-50 pb-4">予約システム設定</h4>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-3">予約受付モード</label>
                            <div class="flex bg-gray-100 p-1 rounded-2xl text-center">
                                <button onclick="window.updateBookingMode('first_come')" id="mode-first-come" class="flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest transition-all">先着順</button>
                                <button onclick="window.updateBookingMode('lottery')" id="mode-lottery" class="flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest transition-all text-gray-400">抽選制</button>
                            </div>
                        </div>

                        <div id="lottery-settings-panel" class="hidden space-y-6 border-t border-gray-50 pt-6 animate-in fade-in zoom-in duration-300">
                            <div>
                                <label class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-3">抽選実行モード</label>
                                <div class="flex bg-gray-100 p-1 rounded-2xl text-center">
                                    <button onclick="window.updateLotteryExecMode('auto')" id="exec-auto" class="flex-1 py-2 rounded-lg text-[9px] font-extrabold uppercase tracking-widest transition-all">自動</button>
                                    <button onclick="window.updateLotteryExecMode('manual')" id="exec-manual" class="flex-1 py-2 rounded-lg text-[9px] font-extrabold uppercase tracking-widest transition-all">手動</button>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-2">実行タイミング</label>
                                    <div class="relative">
                                        <input type="number" id="days-before" class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-xs font-bold outline-none" placeholder="7">
                                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-bold text-gray-400">日前</span>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-extrabold text-gray-400 uppercase tracking-widest mb-2">実行時間</label>
                                    <input type="time" id="exec-time" class="w-full bg-gray-50 border-none rounded-xl px-4 py-3 text-xs font-bold outline-none">
                                </div>
                            </div>
                        </div>

                        <button onclick="window.saveBookingSettings()" class="w-full bg-gray-900 text-white py-4 rounded-[22px] font-bold text-[11px] uppercase tracking-[0.2em] hover:bg-black transition-all shadow-xl shadow-gray-200">設定を保存する</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ================= MODALS ================= -->

    <!-- 新規予約/編集モーダル -->
    <div id="add-booking-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-[32px] shadow-2xl overflow-hidden relative animate-in zoom-in duration-200 flex flex-col p-8">
            <button onclick="window.closeAddBookingModal()" class="absolute top-4 right-4 w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-500 shadow-sm"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="booking-modal-title" class="text-xl font-black text-gray-800 mb-6">新規予約の登録</h3>
            
            <div class="space-y-6 custom-scroll overflow-y-auto max-h-[80vh] pr-1">
                <!-- バンド選択 -->
                <div class="space-y-2 relative">
                    <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block ml-1">予約バンド</label>
                    <div class="relative">
                        <input type="text" id="band-selector-input" autocomplete="off" placeholder="バンドを検索..." class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-bold text-gray-800 outline-none focus:ring-2 focus:ring-blue-100 transition-all">
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
                    </div>
                    <input type="hidden" id="booking-band-id">
                    <div id="band-dropdown-container" class="hidden absolute z-50 left-0 right-0 top-full mt-2 bg-white border border-gray-100 rounded-2xl shadow-xl max-h-48 overflow-y-auto custom-scroll">
                        <ul id="band-dropdown-list" class="py-2"></ul>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block ml-1">日付</label>
                        <input type="date" id="booking-date" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-bold text-gray-800 outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block ml-1">ステータス</label>
                        <select id="booking-status" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-bold text-gray-800 outline-none appearance-none">
                            <option value="pending">承認待ち</option>
                            <option value="confirmed">確定済</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block mb-2">開始時間</label>
                        <input type="time" id="booking-start-time" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-bold text-gray-800 outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block mb-2">終了時間</label>
                        <input type="time" id="booking-end-time" class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 font-bold text-gray-800 outline-none">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest block mb-2">予約タイプ</label>
                    <div class="flex bg-gray-100 p-1 rounded-2xl text-center">
                        <button onclick="window.setBookingType('normal')" id="type-btn-normal" class="flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest transition-all text-blue-600 bg-white shadow-sm">練習</button>
                        <button onclick="window.setBookingType('event')" id="type-btn-event" class="flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase tracking-widest transition-all text-gray-400">イベント</button>
                    </div>
                </div>

                <button onclick="window.handleBookingSubmit()" id="booking-submit-btn" class="w-full bg-blue-600 text-white py-4 rounded-[22px] font-bold text-[11px] uppercase tracking-[0.2em] hover:bg-blue-700 transition-all shadow-xl shadow-blue-100">予約を保存する</button>
            </div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-2xl text-center animate-in zoom-in duration-200">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-trash-can text-2xl"></i></div>
            <h3 class="text-lg font-black text-gray-800 mb-2">確認</h3>
            <p id="confirm-modal-text" class="text-sm text-gray-500 mb-8 font-medium leading-relaxed">この予約を削除しますか？</p>
            <div class="flex gap-4">
                <button onclick="window.closeConfirmModal()" class="flex-1 py-4 text-sm font-bold text-gray-400 hover:text-gray-600 transition-colors">キャンセル</button>
                <button id="confirm-action-btn" class="flex-1 py-4 bg-red-600 text-white rounded-2xl text-sm font-bold shadow-lg shadow-red-100 hover:bg-red-700 transition-all">削除する</button>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script type="module">
        import { initAdminPage, db, escapeHtml } from "/js/admin-common.js?v=20261118-2";
        import { collection, onSnapshot, addDoc, deleteDoc, updateDoc, setDoc, doc, serverTimestamp, Timestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let bookingsData = [], bandsData = [];
        let displayedMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
        let unsubscribeBookings = null;
        let bookingsLoading = true;
        let bookingsError = null;
        let currentBookingType = 'normal';
        let editingBookingId = null;
        let currentConfirmAction = null;
        let settings = { reservationMode: 'first_come', activeEventId: null, lotteryConfig: { mode: 'manual', daysBefore: 7, time: '12:00' } };

        const safetyTimer = setTimeout(() => {
            const loader = document.getElementById('initial-loader');
            if (loader) loader.remove();
        }, 5000);

        initAdminPage('reservation', (user) => {
            clearTimeout(safetyTimer);
            console.log("Admin Booking Module Loaded.");

            onSnapshot(collection(db, 'bands'), s => {
                bandsData = s.docs.map(d => ({id:d.id, ...d.data()}));
            });

            subscribeToDisplayedMonth();

            onSnapshot(doc(db, 'system', 'settings'), s => {
                if(s.exists()) {
                    const data = s.data();
                    settings.reservationMode = data.reservationMode || 'first_come';
                    settings.activeEventId = data.activeEventId || null;
                    if (data.lotteryConfig) settings.lotteryConfig = data.lotteryConfig;
                    renderSettingsUI();
                }
            });
        });

        function bookingDate(value) {
            if (!value) return null;
            if (typeof value.toDate === 'function') return value.toDate();
            if (typeof value.seconds === 'number') return new Date(value.seconds * 1000);
            const parsed = new Date(value);
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        }

        function localDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function subscribeToDisplayedMonth() {
            if (unsubscribeBookings) {
                unsubscribeBookings();
                unsubscribeBookings = null;
            }

            const monthStart = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth(), 1);
            const nextMonthStart = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 1);
            bookingsData = [];
            bookingsLoading = true;
            bookingsError = null;
            renderReservations();

            const monthQuery = query(
                collection(db, 'bookings'),
                where('startTime', '>=', Timestamp.fromDate(monthStart)),
                where('startTime', '<', Timestamp.fromDate(nextMonthStart)),
                orderBy('startTime', 'asc')
            );

            unsubscribeBookings = onSnapshot(monthQuery, snapshot => {
                bookingsData = snapshot.docs.map(item => ({id: item.id, ...item.data()}));
                bookingsLoading = false;
                renderReservations();
            }, error => {
                console.error('Monthly booking query failed:', error);
                bookingsData = [];
                bookingsLoading = false;
                bookingsError = error;
                renderReservations();
            });
        }

        function renderReservations() {
            const container = document.getElementById('booking-calendar-grid');
            const monthLabel = document.getElementById('booking-month-label');
            const count = document.querySelector('#booking-month-count span');
            if (!container || !monthLabel || !count) return;

            monthLabel.textContent = `${displayedMonth.getFullYear()}年 ${displayedMonth.getMonth() + 1}月`;
            count.textContent = bookingsLoading ? '読込中' : `${bookingsData.length}件`;

            if (bookingsLoading) {
                container.innerHTML = `<div class="col-span-7 py-20 text-center text-gray-400"><div class="lmc-loading-state" role="status"><img class="lmc-wave-loader lmc-wave-loader--small" src="/assets/lmc-wave-loader.svg" alt=""><span>この月の予約を読み込み中...</span></div></div>`;
                return;
            }
            if (bookingsError) {
                container.innerHTML = `<div class="col-span-7 py-20 text-center"><i class="fa-solid fa-circle-exclamation text-red-400 text-xl mb-3"></i><p class="text-sm font-bold text-gray-600">予約を読み込めませんでした</p><button type="button" onclick="window.reloadBookingMonth()" class="mt-4 px-4 py-2 rounded-xl bg-gray-900 text-white text-xs font-bold">再読み込み</button></div>`;
                return;
            }

            const bookingsByDay = new Map();
            for (const booking of bookingsData) {
                const start = bookingDate(booking.startTime);
                if (!start) continue;
                const key = localDateKey(start);
                if (!bookingsByDay.has(key)) bookingsByDay.set(key, []);
                bookingsByDay.get(key).push(booking);
            }

            const firstDay = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth(), 1);
            const gridStart = new Date(firstDay);
            gridStart.setDate(firstDay.getDate() - firstDay.getDay());
            const lastDay = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 0);
            const cellCount = Math.ceil((firstDay.getDay() + lastDay.getDate()) / 7) * 7;
            const todayKey = localDateKey(new Date());
            const cells = [];

            for (let index = 0; index < cellCount; index += 1) {
                const date = new Date(gridStart);
                date.setDate(gridStart.getDate() + index);
                const key = localDateKey(date);
                const inMonth = date.getMonth() === displayedMonth.getMonth();
                const dayBookings = bookingsByDay.get(key) || [];
                const visibleBookings = dayBookings.slice(0, 4);
                const weekdayColor = date.getDay() === 0 ? 'text-red-500' : date.getDay() === 6 ? 'text-blue-500' : 'text-gray-600';
                const events = visibleBookings.map(booking => {
                    const start = bookingDate(booking.startTime);
                    const end = bookingDate(booking.endTime);
                    const time = booking.type === 'event'
                        ? '終日'
                        : `${String(start?.getHours() ?? 0).padStart(2, '0')}:${String(start?.getMinutes() ?? 0).padStart(2, '0')}`;
                    const palette = booking.type === 'event'
                        ? 'bg-purple-100 text-purple-700 border-purple-200'
                        : booking.status === 'confirmed'
                            ? 'bg-blue-100 text-blue-700 border-blue-200'
                            : 'bg-amber-100 text-amber-700 border-amber-200';
                    const title = `${time} ${booking.bandName || (booking.type === 'event' ? 'イベント' : '名称未設定')}${end && booking.type !== 'event' ? ` - ${String(end.getHours()).padStart(2, '0')}:${String(end.getMinutes()).padStart(2, '0')}` : ''}`;
                    return `<button type="button" data-booking-id="${escapeHtml(booking.id)}" class="booking-calendar-event block w-full truncate rounded-lg border px-2 py-1 text-left text-[10px] font-extrabold ${palette}" title="${escapeHtml(title)}"><span class="opacity-70 mr-1">${time}</span>${escapeHtml(booking.bandName || (booking.type === 'event' ? 'イベント' : '名称未設定'))}</button>`;
                }).join('');
                const remainder = dayBookings.length - visibleBookings.length;

                cells.push(`
                    <div role="button" tabindex="0" data-calendar-date="${key}" aria-label="${date.getMonth() + 1}月${date.getDate()}日に予約を追加" class="booking-calendar-day ${inMonth ? '' : 'is-outside'} ${key === todayKey ? 'is-today' : ''} border-b border-r border-gray-100 p-2 text-left align-top hover:bg-blue-50/60 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-300 transition-colors cursor-pointer">
                        <span class="booking-calendar-date inline-flex w-7 h-7 items-center justify-center rounded-full text-xs font-extrabold ${weekdayColor} ${key === todayKey ? 'bg-blue-600 !text-white' : ''}">${date.getDate()}</span>
                        <span class="mt-1.5 flex flex-col gap-1">${events}${remainder > 0 ? `<span class="px-2 text-[9px] font-bold text-gray-400">ほか${remainder}件</span>` : ''}</span>
                    </div>`);
            }
            container.innerHTML = cells.join('');
            container.querySelectorAll('[data-booking-id]').forEach(button => {
                button.addEventListener('click', event => {
                    event.stopPropagation();
                    window.openEditBookingModal(button.dataset.bookingId);
                });
            });
            container.querySelectorAll('[data-calendar-date]').forEach(cell => {
                const openNewBooking = () => window.openAddBookingModal(cell.dataset.calendarDate);
                cell.addEventListener('click', openNewBooking);
                cell.addEventListener('keydown', event => {
                    if (event.target !== cell || !['Enter', ' '].includes(event.key)) return;
                    event.preventDefault();
                    openNewBooking();
                });
            });
        }

        window.changeBookingMonth = offset => {
            displayedMonth = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + offset, 1);
            subscribeToDisplayedMonth();
        };
        window.goToBookingToday = () => {
            const today = new Date();
            displayedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            subscribeToDisplayedMonth();
        };
        window.reloadBookingMonth = () => subscribeToDisplayedMonth();
        window.addEventListener('beforeunload', () => {
            if (unsubscribeBookings) unsubscribeBookings();
        });

        function renderSettingsUI() {
            const fcBtn = document.getElementById('mode-first-come');
            const ltBtn = document.getElementById('mode-lottery');
            const ltPanel = document.getElementById('lottery-settings-panel');
            if (settings.reservationMode === 'first_come') {
                fcBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase transition-all bg-white text-blue-600 shadow-sm";
                ltBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase transition-all text-gray-400";
                ltPanel.classList.add('hidden');
            } else {
                ltBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase transition-all bg-white text-blue-600 shadow-sm";
                fcBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase transition-all text-gray-400";
                ltPanel.classList.remove('hidden');
            }
            const cfg = settings.lotteryConfig || {};
            const exAuto = document.getElementById('exec-auto');
            const exMan = document.getElementById('exec-manual');
            if (cfg.mode === 'auto') {
                exAuto.className = "flex-1 py-2 rounded-lg text-[9px] font-extrabold uppercase bg-white text-blue-600 shadow-sm";
                exMan.className = "flex-1 py-2 rounded-lg text-[9px] font-extrabold uppercase text-gray-400";
            } else {
                exMan.className = "flex-1 py-2 rounded-lg text-[9px] font-extrabold uppercase bg-white text-blue-600 shadow-sm";
                exAuto.className = "flex-1 py-2 rounded-lg text-[9px] font-extrabold uppercase text-gray-400";
            }
            document.getElementById('days-before').value = cfg.daysBefore || 7;
            document.getElementById('exec-time').value = cfg.time || '12:00';
        }

        window.updateBookingMode = (m) => { settings.reservationMode = m; renderSettingsUI(); };
        window.updateLotteryExecMode = (m) => { settings.lotteryConfig.mode = m; renderSettingsUI(); };
        window.saveBookingSettings = async () => {
            settings.lotteryConfig.daysBefore = parseInt(document.getElementById('days-before').value) || 7;
            settings.lotteryConfig.time = document.getElementById('exec-time').value || '12:00';
            settings.bookingMode = settings.reservationMode;
            try { await setDoc(doc(db, 'system', 'settings'), settings, { merge: true }); alert("Saved"); } catch(e) { console.error(e); }
        };

        window.openAddBookingModal = (dateKey = '') => {
            editingBookingId = null;
            document.getElementById('booking-modal-title').innerText = "新規予約の登録";
            document.getElementById('booking-band-id').value = "";
            document.getElementById('band-selector-input').value = "";
            const today = new Date();
            const todayInDisplayedMonth = today.getFullYear() === displayedMonth.getFullYear() && today.getMonth() === displayedMonth.getMonth();
            document.getElementById('booking-date').value = dateKey || (todayInDisplayedMonth ? localDateKey(today) : localDateKey(displayedMonth));
            document.getElementById('booking-start-time').value = "";
            document.getElementById('booking-end-time').value = "";
            window.setBookingType('normal');
            const modal = document.getElementById('add-booking-modal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
        };

        window.openEditBookingModal = (id) => {
            const res = bookingsData.find(b => b.id === id);
            if(!res) return;
            editingBookingId = id;
            document.getElementById('booking-modal-title').innerText = "予約内容の編集";
            document.getElementById('booking-band-id').value = res.bandId;
            document.getElementById('band-selector-input').value = res.bandName || "";
            const start = res.startTime ? (res.startTime.toDate ? res.startTime.toDate() : new Date(res.startTime.seconds * 1000)) : new Date();
            const end = res.endTime ? (res.endTime.toDate ? res.endTime.toDate() : new Date(res.endTime.seconds * 1000)) : null;
            document.getElementById('booking-date').value = localDateKey(start);
            document.getElementById('booking-start-time').value = start.getHours().toString().padStart(2,'0') + ":" + start.getMinutes().toString().padStart(2,'0');
            if(end) document.getElementById('booking-end-time').value = end.getHours().toString().padStart(2,'0') + ":" + end.getMinutes().toString().padStart(2,'0');
            document.getElementById('booking-status').value = res.status || "pending";
            window.setBookingType(res.type || 'normal');
            const modal = document.getElementById('add-booking-modal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
        };

        window.closeAddBookingModal = () => {
            const modal = document.getElementById('add-booking-modal');
            modal.classList.remove('modal-active');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        window.setBookingType = (type) => {
            currentBookingType = type;
            const nBtn = document.getElementById('type-btn-normal');
            const eBtn = document.getElementById('type-btn-event');
            if(type === 'normal') {
                nBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase bg-white text-blue-600 shadow-sm";
                eBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase text-gray-400";
            } else {
                eBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase bg-white text-blue-600 shadow-sm";
                nBtn.className = "flex-1 py-2.5 rounded-xl text-[10px] font-extrabold uppercase text-gray-400";
            }
        };

        const bandInput = document.getElementById('band-selector-input');
        const dropdown = document.getElementById('band-dropdown-container');
        bandInput.addEventListener('focus', () => { dropdown.classList.remove('hidden'); renderBandDropdown(); });
        bandInput.addEventListener('input', (e) => renderBandDropdown(e.target.value));
        document.addEventListener('click', (e) => { if (!e.target.closest('#band-selector-input')) dropdown.classList.add('hidden'); });

        function renderBandDropdown(filter = "") {
            const list = document.getElementById('band-dropdown-list');
            const filtered = bandsData.filter(b => !b.isArchived && (b.name||"").toLowerCase().includes(filter.toLowerCase()));
            list.innerHTML = filtered.map(b => `
                <li onclick="window.selectBand('${b.id}', '${b.name.replace(/'/g, "\\'")}')" class="px-5 py-3 hover:bg-blue-50 cursor-pointer flex items-center gap-3 border-b last:border-none">
                    <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-[10px] font-bold text-gray-400">${(b.name||"?")[0]}</div>
                    <span class="text-sm font-bold text-gray-700">${b.name}</span>
                </li>`).join('');
        }

        window.selectBand = (id, name) => { document.getElementById('booking-band-id').value = id; document.getElementById('band-selector-input').value = name; dropdown.classList.add('hidden'); };

        window.handleBookingSubmit = async () => {
            const bandId = document.getElementById('booking-band-id').value;
            const bandName = document.getElementById('band-selector-input').value;
            const dateVal = document.getElementById('booking-date').value;
            const timeVal = document.getElementById('booking-start-time').value;
            const endTimeVal = document.getElementById('booking-end-time').value;
            if(!dateVal || !timeVal || !endTimeVal) return alert("Fill required fields");
            const payload = {
                bandId: bandId || null, bandName: bandName,
                eventId: currentBookingType === 'event' ? null : settings.activeEventId,
                startTime: Timestamp.fromDate(new Date(`${dateVal}T${timeVal}:00`)),
                endTime: Timestamp.fromDate(new Date(`${dateVal}T${endTimeVal}:00`)),
                type: currentBookingType, status: document.getElementById('booking-status').value
            };
            try {
                if(editingBookingId) await updateDoc(doc(db, 'bookings', editingBookingId), payload);
                else await addDoc(collection(db, 'bookings'), { ...payload, createdAt: serverTimestamp() });
                window.closeAddBookingModal();
            } catch (err) { console.error(err); }
        };

        window.deleteBooking = (id) => {
            currentConfirmAction = () => deleteDoc(doc(db, 'bookings', id));
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('modal-active');
        };
        window.closeConfirmModal = () => { const modal = document.getElementById('confirm-modal'); modal.classList.remove('modal-active'); modal.classList.add('hidden'); };
        document.getElementById('confirm-action-btn').onclick = async () => { if(currentConfirmAction) await currentConfirmAction(); window.closeConfirmModal(); };

    </script>
</body>
</html>
