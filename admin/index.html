<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LMC Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LIFF SDK: 管理ログインの戻り先 /admin で認証を完了する -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 共通CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/lmc-loader.css">
    <script defer src="/js/lmc-loader-transition.js?v=20261113-1"></script>
    <style>
        /* 万が一の真っ白防止用 */
        body.loading-failed { display: block !important; }
    </style>
</head>
<body id="main-body" class="min-h-screen flex overflow-hidden bg-[#f8fafc]">
    <!-- ローディング画面 (真っ白防止) -->
    <div id="initial-loader" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-300" role="status" aria-live="polite">
        <img class="lmc-wave-loader" src="/assets/lmc-wave-loader.svg" alt="">
        <p class="lmc-loading-label">管理画面を準備中...</p>
    </div>

    <!-- サイドバーコンテナ (共通JSで中身が挿入されます) -->
    <div id="sidebar-container"></div>

    <!-- メインコンテンツ -->
    <main class="flex-1 ml-[260px] h-screen overflow-y-auto p-8 relative">
        <!-- ヘッダー -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-xl font-extrabold text-gray-800 uppercase tracking-widest">Dashboard</h2>
                <p class="text-[10px] text-gray-400 mt-1 font-bold uppercase tracking-wider">システムの概要と統計</p>
            </div>
            <div id="db-status" class="text-[10px] font-extrabold text-gray-400 uppercase tracking-widest flex items-center gap-2">
                <i class="fa-solid fa-circle text-[8px] text-gray-300"></i> Connecting...
            </div>
        </header>

        <!-- 統計カードグリッド -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            
            <!-- バンド -->
            <a href="./band/" class="group relative bg-white p-8 rounded-[32px] shadow-sm border border-gray-100 hover:shadow-2xl hover:-translate-y-1 transition-all overflow-hidden block">
                <div class="absolute -right-6 -top-6 opacity-[0.03] group-hover:opacity-[0.08] transition-opacity">
                    <i class="fa-solid fa-users-rectangle text-[150px]"></i>
                </div>
                <div class="relative z-10">
                    <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-blue-600 transition-colors text-blue-600 group-hover:text-white">
                        <i class="fa-solid fa-users-rectangle text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-extrabold text-gray-800 tracking-tight">バンド</h3>
                    <div class="mt-2">
                        <span class="bg-blue-50 text-blue-600 px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
                            <span id="stat-band-count">...</span> Bands
                        </span>
                    </div>
                </div>
            </a>

            <!-- イベント -->
            <a href="./event/" class="group relative bg-white p-8 rounded-[32px] shadow-sm border border-gray-100 hover:shadow-2xl hover:-translate-y-1 transition-all overflow-hidden block">
                <div class="absolute -right-6 -top-6 opacity-[0.03] group-hover:opacity-[0.08] transition-opacity">
                    <i class="fa-solid fa-bullhorn text-[150px]"></i>
                </div>
                <div class="relative z-10">
                    <div class="w-16 h-16 bg-sky-100 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-sky-600 transition-colors text-sky-600 group-hover:text-white">
                        <i class="fa-solid fa-bullhorn text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-extrabold text-gray-800 tracking-tight">イベント</h3>
                    <div class="mt-2">
                        <span class="bg-sky-50 text-sky-600 px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
                            <span id="stat-event-count">...</span> Active
                        </span>
                    </div>
                </div>
            </a>

            <!-- Cueシート -->
            <a href="./cue/" class="group relative bg-white p-8 rounded-[32px] shadow-sm border border-gray-100 hover:shadow-2xl hover:-translate-y-1 transition-all overflow-hidden block">
                <div class="absolute -right-6 -top-6 opacity-[0.03] group-hover:opacity-[0.08] transition-opacity">
                    <i class="fa-solid fa-file-invoice text-[150px]"></i>
                </div>
                <div class="relative z-10">
                    <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-emerald-600 transition-colors text-emerald-600 group-hover:text-white">
                        <i class="fa-solid fa-file-invoice text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-extrabold text-gray-800 tracking-tight">Cueシート</h3>
                    <div class="mt-2">
                        <span class="bg-emerald-50 text-emerald-600 px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
                            <span id="stat-cue-count">...</span> Files
                        </span>
                    </div>
                </div>
            </a>

            <!-- 部員 -->
            <a href="./user/" class="group relative bg-white p-8 rounded-[32px] shadow-sm border border-gray-100 hover:shadow-2xl hover:-translate-y-1 transition-all overflow-hidden block">
                <div class="absolute -right-6 -top-6 opacity-[0.03] group-hover:opacity-[0.08] transition-opacity">
                    <i class="fa-solid fa-user-gear text-[150px]"></i>
                </div>
                <div class="relative z-10">
                    <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-indigo-600 transition-colors text-indigo-600 group-hover:text-white">
                        <i class="fa-solid fa-user-gear text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-extrabold text-gray-800 tracking-tight">部員</h3>
                    <div class="mt-2">
                        <span class="bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
                            <span id="stat-user-count">...</span> Members
                        </span>
                    </div>
                </div>
            </a>
        </div>

        <!-- サブセクション -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <a href="./booking/" class="bg-white p-6 rounded-[24px] border border-gray-100 shadow-sm hover:bg-gray-50 flex items-center gap-4 transition-all group">
                <div class="w-12 h-12 bg-red-50 text-red-500 rounded-xl flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors shadow-sm">
                    <i class="fa-solid fa-calendar-check text-xl"></i>
                </div>
                <div>
                    <h4 class="font-bold text-gray-800">予約システム設定</h4>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Studio Booking Config</p>
                </div>
                <i class="fa-solid fa-chevron-right ml-auto text-gray-200 group-hover:text-red-500 transition-colors"></i>
            </a>

            <a href="./maintenance/" class="bg-white p-6 rounded-[24px] border border-gray-100 shadow-sm hover:bg-gray-50 flex items-center gap-4 transition-all group">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center group-hover:bg-amber-600 group-hover:text-white transition-all"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                <div>
                    <h4 class="font-bold text-gray-800">メンテナンスモード</h4>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Mobile App Control</p>
                </div>
                <i class="fa-solid fa-chevron-right ml-auto text-gray-200 group-hover:text-amber-500 transition-colors"></i>
            </a>

            <a href="./expenses/" class="bg-white p-6 rounded-[24px] border border-gray-100 shadow-sm hover:bg-gray-50 flex items-center gap-4 transition-all group">
                <div class="w-12 h-12 bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-colors shadow-sm">
                    <i class="fa-solid fa-coins text-xl"></i>
                </div>
                <div>
                    <h4 class="font-bold text-gray-800">部費の管理 (仮)</h4>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Accounting - Beta</p>
                </div>
                <i class="fa-solid fa-chevron-right ml-auto text-gray-200 group-hover:text-orange-500 transition-colors"></i>
            </a>
        </div>
    </main>

    <!-- Logic -->
    <script type="module">
        import { initAdminPage, db, auth, LIFF_ID, ADMIN_BASE_PATH } from "/js/admin-common.js?v=20261128-timetable";
        import { signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { collection, getCountFromServer, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { signInFirebaseWithLine } from "/js/line-firebase-auth.js?v=20261031-3";

        // 安全装置: 5秒経っても初期化が終わらなければ強制解除
        const safetyTimer = setTimeout(() => {
            const loader = document.getElementById('initial-loader');
            if (loader) loader.remove();
        }, 5000);

        const DASHBOARD_STATS_CACHE_KEY = 'lmc_admin_dashboard_stats_v1';
        const DASHBOARD_STATS_CACHE_TTL = 5 * 60 * 1000;
        let dashboardStarted = false;

        const renderDashboardStats = (stats) => {
            document.getElementById('stat-band-count').innerText = stats.bands;
            document.getElementById('stat-event-count').innerText = stats.events;
            document.getElementById('stat-cue-count').innerText = stats.cuesheets;
            document.getElementById('stat-user-count').innerText = stats.users;
        };

        const getCachedDashboardStats = () => {
            try {
                const cached = JSON.parse(sessionStorage.getItem(DASHBOARD_STATS_CACHE_KEY) || 'null');
                if (!cached?.savedAt || !cached?.stats || Date.now() - cached.savedAt >= DASHBOARD_STATS_CACHE_TTL) return null;
                return cached.stats;
            } catch {
                sessionStorage.removeItem(DASHBOARD_STATS_CACHE_KEY);
                return null;
            }
        };

        const loadDashboardStats = async () => {
            const cached = getCachedDashboardStats();
            if (cached) {
                renderDashboardStats(cached);
                return;
            }

            // 件数カードにリアルタイム監視は不要。集計クエリで全ドキュメントの再読込を防ぐ。
            const [allBands, archivedBands, events, cuesheets, users] = await Promise.all([
                getCountFromServer(collection(db, 'bands')),
                getCountFromServer(query(collection(db, 'bands'), where('isArchived', '==', true))),
                getCountFromServer(collection(db, 'events')),
                getCountFromServer(collection(db, 'cuesheets')),
                getCountFromServer(collection(db, 'users'))
            ]);

            const stats = {
                bands: Math.max(0, allBands.data().count - archivedBands.data().count),
                events: events.data().count,
                cuesheets: cuesheets.data().count,
                users: users.data().count
            };
            sessionStorage.setItem(DASHBOARD_STATS_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), stats }));
            renderDashboardStats(stats);
        };

        const startDashboard = () => {
            if (dashboardStarted) return;
            dashboardStarted = true;

            initAdminPage('dashboard', () => {
                clearTimeout(safetyTimer);
                loadDashboardStats().catch((error) => {
                    console.error('Dashboard stats error:', error);
                    ['stat-band-count', 'stat-event-count', 'stat-cue-count', 'stat-user-count'].forEach((id) => {
                        document.getElementById(id).innerText = '—';
                    });
                });
            });
        };

        const completePendingLineLogin = async () => {
            if (sessionStorage.getItem('lmc_admin_auth_pending') !== 'true') return false;

            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) throw new Error('LINE login did not complete');

                const profile = await liff.getProfile();
                await signInFirebaseWithLine(auth, signInWithCustomToken, profile.userId, {
                    requiredClaims: ['admin'],
                    forceReauthentication: true
                });

                sessionStorage.removeItem('lmc_admin_auth_pending');
                const target = sessionStorage.getItem('lmc_admin_redirect') || `${ADMIN_BASE_PATH}/`;
                sessionStorage.removeItem('lmc_admin_redirect');

                if (target !== `${ADMIN_BASE_PATH}/` && target.startsWith(`${ADMIN_BASE_PATH}/`)) {
                    window.location.replace(target);
                    return true;
                }
                window.history.replaceState(null, '', `${ADMIN_BASE_PATH}/`);
                return false;
            } catch (error) {
                console.error('Admin LINE callback failed:', error);
                sessionStorage.removeItem('lmc_admin_auth_pending');
                const reason = error?.code === 'auth/required-claim-missing' ? 'permission' : 'failed';
                window.location.replace(`${ADMIN_BASE_PATH}/login.html?authError=${reason}`);
                return true;
            }
        };

        (async () => {
            if (typeof auth.authStateReady === 'function') await auth.authStateReady();
            if (await completePendingLineLogin()) return;
            startDashboard();
        })();
    </script>
</body>
</html>
