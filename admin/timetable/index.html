<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <title>タイムテーブル | LMC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/lmc-loader.css">
    <style>
        .tt-control { min-width:0; min-height:2.5rem; border:1px solid #f3f4f6; border-radius:.75rem; background:#f9fafb; padding:.625rem .75rem; color:#1f2937; font-size:.875rem; font-weight:700; }
        .tt-sidebar { display:none; }
        @media (min-width:1024px) { .tt-sidebar { display:block; } }
        .tt-main { height:100vh; height:100dvh; }
        .tt-main [hidden] { display:none; }
        .tt-control:focus-visible, .tt-settings .switch input:focus-visible + .slider { outline:2px solid #0ea5e9; outline-offset:2px; }
        .tt-day[aria-pressed="true"] { background:#fff; color:#0369a1; box-shadow:0 1px 3px #0f172a1a; }
        .tt-day[aria-pressed="true"] .tt-day-count { background:#e0f2fe; color:#0369a1; }
        .tt-schedule { container-type:inline-size; }
        .tt-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(7rem,auto) minmax(6rem,auto) auto; gap:.75rem; align-items:center; }
        .tt-row[data-drop-target] { background:#f0f9ff; box-shadow:inset 3px 0 #0ea5e9; }
        .tt-grip { cursor:grab; }
        .tt-grip:active { cursor:grabbing; }
        #tt-band-detail { width:min(calc(100% - 2rem), 28rem); }
        #tt-band-detail::backdrop { background:rgb(0 0 0 / .4); backdrop-filter:blur(4px); }
        @media (max-width:650px) {
            .tt-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; }
            .tt-band { grid-column:1/-1; }
        }
        @container (max-width:470px) {
            .tt-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto; }
            .tt-band { grid-column:1/-1; }
        }
    </style>
</head>
<body class="min-h-screen flex overflow-hidden bg-[#f8fafc]">
    <div id="initial-loader" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center transition-opacity duration-300" role="status">
        <img class="lmc-wave-loader" src="/assets/lmc-wave-loader.svg" alt="">
        <p class="lmc-loading-label">タイムテーブルを準備中…</p>
    </div>
    <div id="sidebar-container" class="tt-sidebar"></div>
    <main class="tt-main flex-1 min-w-0 lg:ml-[260px] overflow-y-auto relative p-4 sm:p-8">
        <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <h1 class="text-xl font-extrabold text-gray-800 tracking-widest">タイムテーブル</h1>
            <a href="../event/" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white border border-gray-200 text-xs font-bold text-gray-600 hover:bg-gray-50 transition-colors">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>イベント管理
            </a>
        </header>
        <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 p-5 sm:p-6 mb-6 flex flex-wrap items-center gap-x-6 gap-y-3">
            <div class="w-full sm:w-auto sm:min-w-[18rem] flex items-center gap-3">
                <span class="h-10 w-10 shrink-0 rounded-xl bg-sky-50 text-sky-600 grid place-items-center"><i class="fa-regular fa-calendar" aria-hidden="true"></i></span>
                <div class="min-w-0 flex-1">
                    <label for="tt-event" class="block mb-1 text-xs font-extrabold text-gray-600">イベント</label>
                    <select id="tt-event" class="tt-control w-full" disabled></select>
                </div>
            </div>
            <p id="tt-status" class="text-xs font-semibold text-gray-500" role="status" aria-live="polite">管理者権限を確認しています…</p>
        </div>

        <fieldset id="tt-editor" class="min-w-0" hidden>
            <div class="grid grid-cols-1 xl:grid-cols-4 gap-6 items-start">
                <section class="tt-schedule bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden xl:col-span-3" aria-label="出演順">
                    <div class="p-4 sm:p-6 space-y-4 bg-gray-50/50">
                        <div id="tt-days" class="flex gap-1 p-1 rounded-2xl bg-gray-100 overflow-x-auto w-fit max-w-full" aria-label="出演日"></div>
                        <div id="tt-fill" class="flex flex-wrap items-end gap-3">
                            <div class="flex flex-wrap gap-3">
                                <label class="flex flex-col gap-1 text-xs font-bold text-gray-600">最初の開始時刻<input id="tt-start" class="tt-control" type="time" value="10:00"></label>
                                <label class="flex flex-col gap-1 text-xs font-bold text-gray-600">出演間隔（分）<input id="tt-interval" class="tt-control w-24" type="number" min="1" max="180" value="20"></label>
                            </div>
                            <button id="tt-apply-times" type="button" class="inline-flex items-center gap-2 min-h-10 px-4 rounded-xl bg-sky-50 hover:bg-sky-100 text-sky-800 text-xs font-bold transition-colors disabled:opacity-40">
                                <i class="fa-regular fa-clock" aria-hidden="true"></i>この日の時刻を一括設定
                            </button>
                        </div>
                    </div>
                    <ol id="tt-rows" class="divide-y divide-gray-100 border-t border-gray-100"></ol>
                </section>
                <section class="tt-settings bg-white rounded-[32px] p-5 sm:p-6 shadow-sm border border-gray-100">
                    <h2 class="font-extrabold text-gray-800 text-sm border-b border-gray-100 pb-4">公開設定</h2>
                    <div class="py-4 space-y-4">
                        <div class="flex items-center justify-between gap-2">
                            <label for="tt-published" class="text-xs font-bold text-gray-700">タイムテーブルを公開</label>
                            <label class="switch shrink-0"><input id="tt-published" type="checkbox"><span class="slider" aria-hidden="true"></span></label>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <label for="tt-show-times" class="text-xs font-bold text-gray-700">公開画面に時刻を表示</label>
                            <label class="switch shrink-0"><input id="tt-show-times" type="checkbox"><span class="slider" aria-hidden="true"></span></label>
                        </div>
                    </div>
                    <button id="tt-save" type="button" class="w-full rounded-[22px] bg-sky-600 hover:bg-sky-700 px-4 py-3.5 text-white text-xs font-bold shadow-lg shadow-sky-100 transition-colors disabled:opacity-40">
                        <i class="fa-regular fa-floppy-disk mr-1" aria-hidden="true"></i>変更を保存
                    </button>
                </section>
            </div>
        </fieldset>
    </main>

    <dialog id="tt-band-detail" aria-labelledby="tt-band-title" class="m-auto max-w-md rounded-[32px] bg-white p-0 shadow-2xl">
        <div class="p-6 sm:p-8">
            <div class="flex items-start justify-between gap-3 mb-5">
                <div class="flex min-w-0 items-center gap-3">
                    <span class="w-10 h-10 shrink-0 rounded-xl bg-sky-50 text-sky-600 grid place-items-center"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
                    <h2 id="tt-band-title" class="text-xl font-extrabold text-gray-800 break-words min-w-0"></h2>
                </div>
                <form method="dialog"><button class="w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full grid place-items-center text-gray-600" aria-label="バンド詳細を閉じる"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></form>
            </div>
            <p id="tt-band-date" class="rounded-xl bg-gray-50 p-3 text-sm font-semibold text-gray-600 mb-5"></p>
            <a id="tt-cue-link" class="flex items-center justify-center gap-2 rounded-[22px] bg-sky-600 hover:bg-sky-700 px-4 py-3.5 text-white text-xs font-bold shadow-lg shadow-sky-100 transition-colors" target="_blank" rel="noopener noreferrer"><i class="fa-regular fa-file-lines" aria-hidden="true"></i>Cueシートを開く</a>
        </div>
    </dialog>
    <script type="module" src="./editor.js?v=2"></script>
</body>
</html>
