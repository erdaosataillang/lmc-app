<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンテナンスモード | LMC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#f8f9fc] text-gray-900 min-h-screen">
    <div id="sidebar-container"></div>
    <main class="ml-[260px] p-8 lg:p-12 min-h-screen">
        <div class="max-w-4xl mx-auto">
            <header class="mb-9">
                <p class="text-[11px] font-black tracking-[0.18em] text-amber-600 uppercase mb-2">Mobile App Control</p>
                <h2 class="text-3xl font-black tracking-tight">メンテナンスモード</h2>
            </header>

            <section class="bg-white rounded-[32px] border border-gray-100 shadow-sm overflow-hidden">
                <div class="p-7 sm:p-9 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center gap-5">
                    <div id="status-icon" class="w-16 h-16 rounded-3xl bg-emerald-50 text-emerald-600 grid place-items-center text-2xl shrink-0">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <p class="text-xs font-bold text-gray-400 mb-1">現在の状態</p>
                        <h3 id="status-label" class="text-2xl font-black">確認中...</h3>
                        <p id="status-detail" class="text-sm text-gray-500 mt-1">設定を読み込んでいます</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer shrink-0">
                        <input id="maintenance-enabled" type="checkbox" class="sr-only peer">
                        <span class="w-16 h-9 bg-gray-200 rounded-full peer peer-checked:bg-amber-500 transition-colors after:content-[''] after:absolute after:top-1 after:left-1 after:w-7 after:h-7 after:bg-white after:rounded-full after:shadow after:transition-transform peer-checked:after:translate-x-7"></span>
                    </label>
                </div>

                <form id="maintenance-form" class="p-7 sm:p-9 space-y-6">
                    <div>
                        <label for="maintenance-title" class="block text-sm font-bold text-gray-700 mb-2">表示タイトル</label>
                        <input id="maintenance-title" maxlength="80" class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:border-amber-400 focus:ring-4 focus:ring-amber-50 outline-none transition" value="メンテナンス中です">
                    </div>
                    <div>
                        <label for="maintenance-message" class="block text-sm font-bold text-gray-700 mb-2">利用者へのメッセージ</label>
                        <textarea id="maintenance-message" maxlength="500" rows="5" class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:border-amber-400 focus:ring-4 focus:ring-amber-50 outline-none transition resize-y">時間をおいて、もう一度お試しください。</textarea>
                    </div>
                    <div class="rounded-2xl bg-amber-50 border border-amber-100 p-4 flex gap-3 text-sm text-amber-900">
                        <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                        <p class="leading-relaxed">ONにすると、スマホ用WEBアプリ全体にメンテナンス画面が表示されます。管理WEBは引き続き利用できます。</p>
                    </div>
                    <button id="save-button" type="submit" class="w-full sm:w-auto px-7 py-3.5 rounded-2xl bg-gray-900 text-white font-bold hover:bg-black disabled:opacity-40 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i><span>設定を保存</span>
                    </button>
                </form>
            </section>
        </div>
    </main>

    <script type="module">
        import {initAdminPage, db} from "/js/admin-common.js?v=20261118-1";
        import {doc, getDoc, serverTimestamp, setDoc} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const settingsRef = doc(db, "system", "settings");
        const enabledInput = document.getElementById("maintenance-enabled");
        const titleInput = document.getElementById("maintenance-title");
        const messageInput = document.getElementById("maintenance-message");
        const statusIcon = document.getElementById("status-icon");
        const statusLabel = document.getElementById("status-label");
        const statusDetail = document.getElementById("status-detail");
        const saveButton = document.getElementById("save-button");

        function renderStatus(data = {}) {
            const enabled = data.enabled === true;
            enabledInput.checked = enabled;
            titleInput.value = data.title || "メンテナンス中です";
            messageInput.value = data.message || "時間をおいて、もう一度お試しください。";
            statusIcon.className = `w-16 h-16 rounded-3xl grid place-items-center text-2xl shrink-0 ${enabled ? "bg-amber-50 text-amber-600" : "bg-emerald-50 text-emerald-600"}`;
            statusIcon.innerHTML = `<i class="fa-solid ${enabled ? "fa-screwdriver-wrench" : "fa-circle-check"}"></i>`;
            statusLabel.textContent = enabled ? "メンテナンス中" : "通常運用中";
            const updatedAt = data.updatedAt?.toDate?.();
            statusDetail.textContent = updatedAt ? `最終更新: ${updatedAt.toLocaleString("ja-JP")}` : "まだ変更されていません";
        }

        initAdminPage("maintenance", async (user) => {
            const snapshot = await getDoc(settingsRef);
            renderStatus(snapshot.data()?.mobileMaintenance || {});

            document.getElementById("maintenance-form").addEventListener("submit", async (event) => {
                event.preventDefault();
                const next = {
                    enabled: enabledInput.checked,
                    title: titleInput.value.trim().slice(0, 80) || "メンテナンス中です",
                    message: messageInput.value.trim().slice(0, 500) || "時間をおいて、もう一度お試しください。",
                    updatedAt: serverTimestamp(),
                    updatedBy: user.uid,
                };
                saveButton.disabled = true;
                saveButton.querySelector("span").textContent = "保存中...";
                try {
                    await setDoc(settingsRef, {mobileMaintenance: next}, {merge: true});
                    const refreshed = await getDoc(settingsRef);
                    renderStatus(refreshed.data()?.mobileMaintenance || next);
                } catch (error) {
                    console.error("Maintenance settings save failed:", error);
                    alert("設定を保存できませんでした。もう一度お試しください。");
                } finally {
                    saveButton.disabled = false;
                    saveButton.querySelector("span").textContent = "設定を保存";
                }
            });
        });
    </script>
</body>
</html>
