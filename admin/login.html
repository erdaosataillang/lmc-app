<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LMC Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 共通CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f8fafc] p-6">

    <div class="w-full max-w-md animate-in fade-in zoom-in duration-500">
        <!-- ロゴエリア -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-blue-600 rounded-[28px] flex items-center justify-center text-white shadow-2xl shadow-blue-200 mx-auto mb-6">
                <i class="fa-solid fa-guitar text-4xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tighter text-gray-900">
                LMC <span class="text-blue-600">Admin</span>
            </h1>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mt-2">
                Light Music Club Management System
            </p>
        </div>

        <!-- ログインカード -->
        <div class="bg-white rounded-[40px] p-10 shadow-sm border border-gray-100 text-center">
            <h2 class="text-xl font-black text-gray-800 mb-2">管理者ログイン</h2>
            <p class="text-sm text-gray-500 font-medium mb-10">
                管理パネルにアクセスするには<br>LINEアカウントで認証してください。
            </p>

            <div class="space-y-4">
                <!-- LINEログインボタン -->
                <button id="btn-login" onclick="window.handleLineLogin()" class="w-full bg-[#06C755] hover:bg-[#05b34d] text-white py-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-3 transition-all active:scale-[0.98] shadow-lg shadow-green-100">
                    <i class="fa-brands fa-line text-2xl"></i>
                    LINEでログイン
                </button>

                <div id="loading-spinner" class="hidden py-4">
                    <i class="fa-solid fa-spinner fa-spin text-blue-500 text-2xl"></i>
                    <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest mt-2">Authenticating...</p>
                </div>

                <p id="login-error" class="hidden rounded-2xl bg-red-50 px-4 py-3 text-left text-xs font-bold leading-relaxed text-red-600"></p>
            </div>

            <div class="mt-10 pt-8 border-t border-gray-50">
                <p class="text-[9px] text-gray-300 font-bold uppercase tracking-widest">
                    Authorized Personnel Only
                </p>
            </div>
        </div>

        <!-- フッター -->
        <p class="text-center mt-8 text-gray-400 text-[10px] font-medium">
            &copy; 2026 LMC Management Team. All rights reserved.
        </p>
    </div>

    <!-- Logic -->
    <script type="module">
        import { auth, LIFF_ID } from "/js/admin-common.js?v=20261031-3";
        import { signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { signInFirebaseWithLine } from "/js/line-firebase-auth.js?v=20261031-3";

        let redirecting = false;
        let loginPromise = null;
        let liffInitPromise = null;

        // URLパラメータからリダイレクト先を取得
        const getRedirectUrl = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectPath = urlParams.get('redirect');
            if (!redirectPath) return "/admin/";
            try {
                const target = new URL(redirectPath, window.location.origin);
                if (target.origin !== window.location.origin || !target.pathname.startsWith('/admin/') || target.pathname === '/admin/login.html') {
                    return "/admin/";
                }
                return `${target.pathname}${target.search}${target.hash}`;
            } catch (_) {
                return "/admin/";
            }
        };

        const setLoginState = (loading, message = '') => {
            const btn = document.getElementById('btn-login');
            const spinner = document.getElementById('loading-spinner');
            const error = document.getElementById('login-error');
            btn.classList.toggle('hidden', loading);
            spinner.classList.toggle('hidden', !loading);
            error.textContent = message;
            error.classList.toggle('hidden', !message);
        };

        const redirectToAdmin = () => {
            if (redirecting) return;
            redirecting = true;
            window.location.replace(getRedirectUrl());
        };

        const initializeLiff = () => {
            if (!liffInitPromise) {
                liffInitPromise = liff.init({
                    liffId: LIFF_ID,
                    withLoginOnExternalBrowser: true
                });
            }
            return liffInitPromise;
        };

        const withTimeout = (promise, milliseconds) => Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error('LINE initialization timed out')), milliseconds))
        ]);

        // すでにログインしている場合は自動リダイレクト
        onAuthStateChanged(auth, async (user) => {
            if (user && !user.isAnonymous) {
                try {
                    const tokenResult = await user.getIdTokenResult();
                    if (tokenResult.claims.line === true && tokenResult.claims.admin === true) {
                        redirectToAdmin();
                    }
                } catch (error) {
                    console.warn('Existing admin session could not be verified.', error);
                }
            }
        });

        const authenticateWithLine = async () => {
            if (loginPromise) return loginPromise;
            loginPromise = (async () => {
                setLoginState(true);
                sessionStorage.setItem('lmc_admin_auth_pending', 'true');
                sessionStorage.setItem('lmc_admin_redirect', getRedirectUrl());

                // 管理用LIFFの登録済みエンドポイント /admin へ戻り、そこでFirebase認証を完了する。
                await withTimeout(initializeLiff(), 15000);

                if (!liff.isLoggedIn()) {
                    throw new Error('LINE login did not complete');
                }

                const profile = await liff.getProfile();
                await signInFirebaseWithLine(auth, signInWithCustomToken, profile.userId, {
                    requiredClaims: ['admin'],
                    forceReauthentication: true
                });
                redirectToAdmin();
            })().catch(error => {
                console.error("Login failed:", error);
                const message = error?.code === 'auth/required-claim-missing'
                    ? 'このLINEアカウントには管理権限がありません。'
                    : 'LINE認証を完了できませんでした。もう一度お試しください。';
                setLoginState(false, message);
                throw error;
            }).finally(() => {
                loginPromise = null;
            });
            return loginPromise;
        };

        window.handleLineLogin = () => authenticateWithLine().catch(() => {});

        // Firebaseの既存セッションを先に確認し、必要な場合だけLIFFを開始する。
        window.addEventListener('load', async () => {
            try {
                if (typeof auth.authStateReady === 'function') await auth.authStateReady();
                if (redirecting) return;
                const authError = new URLSearchParams(window.location.search).get('authError');
                if (authError) {
                    sessionStorage.removeItem('lmc_admin_auth_pending');
                    const message = authError === 'permission'
                        ? 'このLINEアカウントには管理権限がありません。'
                        : 'LINE認証を完了できませんでした。もう一度お試しください。';
                    setLoginState(false, message);
                    return;
                }
                await authenticateWithLine();
            } catch (_) {
                // authenticateWithLine側で再試行できる状態とメッセージを表示する。
            }
        });
    </script>
</body>
</html>
