<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LMC Mobile - タイムテーブル</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        html { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
        body { margin:0; width:100%; height:100vh; height:100dvh; overflow:hidden; background:#f1f4f9; color:#1f1f1f; font-family:'Roboto','Noto Sans JP',sans-serif; }
        * { box-sizing:border-box; }
        .app { max-width:480px; width:100%; height:100%; min-height:0; margin:0 auto; display:flex; flex-direction:column; padding-bottom:calc(76px + env(safe-area-inset-bottom, 0px)); }
        .header { flex-shrink:0; padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
        .title { font-size:20px; font-weight:700; }
        .event-name { font-size:11px; color:#5f6368; max-width:55%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .content { flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:8px 16px 24px; }
        .day-tabs { display:flex; gap:8px; overflow-x:auto; padding:4px 0 14px; scrollbar-width:none; }
        .day-tabs::-webkit-scrollbar { display:none; }
        .day-tab { flex:0 0 auto; border:0; border-radius:999px; padding:9px 16px; background:#fff; color:#5f6368; font-size:12px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.04); }
        .day-tab.active { background:#1f1f1f; color:#fff; }
        .schedule-card { background:#fff; border-radius:18px; padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; box-shadow:0 2px 10px rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.03); }
        .time { width:62px; flex-shrink:0; font-size:14px; font-weight:700; color:#0b57d0; text-align:center; }
        .band-icon { width:46px; height:46px; flex-shrink:0; border-radius:14px; object-fit:cover; background:#e8eaed; }
        .band-info { min-width:0; flex:1; }
        .band-name { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .band-sub { font-size:11px; color:#8e8e93; margin-top:4px; }
        .mine { font-size:10px; color:#137333; background:#e6f4ea; padding:4px 8px; border-radius:999px; font-weight:700; }
        .state { text-align:center; padding:64px 20px; color:#8e8e93; font-size:14px; line-height:1.6; }
        .bottom-nav { position:fixed; bottom:0; left:0; width:100%; box-sizing:border-box; background:rgba(255,255,255,.88); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid rgba(224,227,231,.7); display:flex; justify-content:space-around; padding:8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); z-index:2000; transform:translateZ(0); }
        .nav-item { display:flex; flex-direction:column; align-items:center; flex:1; gap:4px; color:#5f6368; font-size:9px; font-weight:600; cursor:pointer; }
        .nav-icon { font-size:22px; padding:4px 10px; border-radius:16px; }
        .nav-item.active { color:#1f1f1f; transform:translateY(-4px); }
        .nav-item.active .nav-icon { background:#c2e7ff; color:#001d35; padding:4px 16px; }
        .hidden { display:none !important; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="title">タイムテーブル</div>
            <div class="event-name" id="eventName">イベントを確認中...</div>
        </header>
        <section class="content">
            <div class="day-tabs" id="dayTabs"></div>
            <div id="scheduleList"><div class="state"><span class="material-icons" style="animation:spin 1s linear infinite;">sync</span><br>読み込み中...</div></div>
        </section>
    </main>
    <div id="nav-container"></div>

    <script type="module">
        import { app, db, auth, MY_LIFF_ID } from './js/common.js';
        import { collection, doc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        let bands = [];
        let eventData = null;
        let selectedDay = 1;
        let currentUser = null;

        function renderNav() {
            const isAdmin = localStorage.getItem('lmc_is_admin') === 'true';
            const items = [
                {id:'index', label:'マイバンド', icon:'groups', href:'/index.html'},
                {id:'timetable', label:'タイムテーブル', icon:'view_timeline', href:'/timetable.html'},
                {id:'booking', label:'合わせ予約', icon:'calendar_month', href:'/booking.html'},
                {id:'admin', label:'管理', icon:'admin_panel_settings', href:'/manage.html', hidden:!isAdmin},
                {id:'mypage', label:'マイページ', icon:'account_circle', href:'https://mypage.sorairosystem.com'}
            ];
            document.getElementById('nav-container').innerHTML = `<div class="bottom-nav">${items.filter(item => !item.hidden).map(item => `
                <div class="nav-item ${item.id === 'timetable' ? 'active' : ''}" onclick="window.location.href='${item.href}'">
                    <span class="material-icons nav-icon">${item.icon}</span><span>${item.label}</span>
                </div>`).join('')}</div>`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'\"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[char]));
        }

        function safeImageUrl(value) {
            try {
                const url = new URL(value || '', window.location.href);
                return ['http:', 'https:'].includes(url.protocol) ? escapeHtml(url.href) : 'https://ul.h3z.jp/Vnukmtvq.jpg';
            } catch (_) {
                return 'https://ul.h3z.jp/Vnukmtvq.jpg';
            }
        }

        function toDateLabel(dayNumber) {
            if (!eventData?.startDate) return `Day ${dayNumber}`;
            const base = new Date(`${eventData.startDate}T00:00:00`);
            base.setDate(base.getDate() + dayNumber - 1);
            return `${base.getMonth()+1}/${base.getDate()} Day ${dayNumber}`;
        }

        function getTimeValue(band) {
            const value = band.performanceTime || band.timetableTime || band.appearanceTime || band.time;
            if (!value) return '時間未定';
            if (typeof value === 'string') return value;
            if (value.toDate) {
                const date = value.toDate();
                return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
            }
            return '時間未定';
        }

        function render() {
            const availableDays = new Set(bands.map(band => Number.parseInt(band.day, 10) || 1));
            if (eventData?.startDate && eventData?.endDate) {
                const start = new Date(`${eventData.startDate}T12:00:00`);
                const end = new Date(`${eventData.endDate}T12:00:00`);
                const dayCount = Math.max(1, Math.round((end - start) / 86400000) + 1);
                for (let day = 1; day <= dayCount; day += 1) availableDays.add(day);
            }
            if (availableDays.size === 0) availableDays.add(1);
            const sortedDays = [...availableDays].sort((a,b) => a-b);
            if (!sortedDays.includes(selectedDay)) selectedDay = sortedDays[0];
            document.getElementById('dayTabs').innerHTML = sortedDays.map(day => `<button class="day-tab ${day === selectedDay ? 'active' : ''}" onclick="selectDay(${day})">${toDateLabel(day)}</button>`).join('');

            const list = bands.filter(band => (Number.parseInt(band.day, 10) || 1) === selectedDay)
                .sort((a,b) => getTimeValue(a).localeCompare(getTimeValue(b), 'ja'));
            const container = document.getElementById('scheduleList');
            if (list.length === 0) {
                container.innerHTML = '<div class="state"><span class="material-icons" style="font-size:44px; color:#c7c7cc;">event_busy</span><br>この日の出演予定はありません</div>';
                return;
            }
            container.innerHTML = list.map(band => {
                const mine = currentUser && Array.isArray(band.memberIds) && band.memberIds.includes(currentUser);
                return `<article class="schedule-card">
                    <div class="time">${getTimeValue(band)}</div>
                    <img class="band-icon" src="${safeImageUrl(band.icon)}" alt="">
                    <div class="band-info"><div class="band-name">${escapeHtml(band.name || '名称未設定')}</div><div class="band-sub">${escapeHtml(band.stage || '会場未定')}</div></div>
                    ${mine ? '<span class="mine">参加中</span>' : ''}
                </article>`;
            }).join('');
        }

        window.selectDay = day => { selectedDay = day; render(); };

        async function main() {
            renderNav();
            try {
                const authPromise = signInAnonymously(auth);
                const liffPromise = liff.init({liffId:MY_LIFF_ID}).then(async () => {
                    if (liff.isLoggedIn()) currentUser = (await liff.getProfile()).userId;
                }).catch(error => console.warn('LIFF initialization failed:', error));
                await Promise.all([authPromise, liffPromise]);

                const settings = await getDoc(doc(db, 'system', 'settings'));
                const activeEventId = settings.exists() ? settings.data().activeEventId : null;
                if (!activeEventId) {
                    document.getElementById('eventName').innerText = 'イベント未設定';
                    document.getElementById('scheduleList').innerHTML = '<div class="state">現在のイベントが設定されていません</div>';
                    return;
                }
                const [eventSnapshot, bandSnapshot] = await Promise.all([
                    getDoc(doc(db, 'events', activeEventId)),
                    getDocs(query(collection(db, 'bands'), where('events', 'array-contains', activeEventId)))
                ]);
                eventData = eventSnapshot.exists() ? eventSnapshot.data() : null;
                bands = bandSnapshot.docs.map(bandDoc => ({id:bandDoc.id, ...bandDoc.data()})).filter(band => !band.isArchived);
                document.getElementById('eventName').innerText = eventData?.event || eventData?.name || '現在のイベント';
                render();
            } catch (error) {
                console.error('Timetable load failed:', error);
                document.getElementById('scheduleList').innerHTML = '<div class="state">タイムテーブルを読み込めませんでした<br><button class="day-tab" style="margin-top:14px;" onclick="location.reload()">再読み込み</button></div>';
            }
        }

        main();
    </script>
</body>
</html>
